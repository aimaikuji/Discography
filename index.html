<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アルバム／シングル</title>
  <style>
    body { font-family: sans-serif; padding: 16px; max-width: 960px; margin: 0 auto; }

    .section { background: #f8f8f8; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .section h3 { margin: 0 0 10px; font-size: 14px; color: #555; }

    .col-checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .col-checks label {
      display: flex; align-items: center; gap: 4px;
      font-size: 14px; cursor: pointer;
      background: white; border: 1px solid #ddd;
      border-radius: 4px; padding: 4px 10px;
    }

    .sort-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sort-row span { font-size: 13px; color: #666; width: 56px; flex-shrink: 0; }
    .sort-row select { flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
    .order-btn {
      padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc;
      background: white; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .order-btn.asc  { background: #e8f0fe; border-color: #4a90e2; color: #4a90e2; }
    .order-btn.desc { background: #fce8e6; border-color: #d95050; color: #d95050; }

    .apply-btn {
      width: 100%; padding: 10px; background: #4a90e2; color: white;
      border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 4px;
    }
    .apply-btn:active { background: #357abd; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; white-space: nowrap; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 14px; }
    th { background: #f0f0f0; }
    tr:nth-child(even) td { background: #fafafa; }
  </style>
</head>
<body>

<div class="section">
  <h3>📋 表示する列</h3>
  <div class="col-checks" id="colChecks"></div>
</div>

<div class="section">
  <h3>🔃 ソート設定</h3>
  <div id="sortKeys"></div>
  <button class="apply-btn" onclick="applySort()">ソート実行</button>
</div>

<div class="table-wrap">
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- データファイルを先に読み込む -->
<script src="data.js"></script>

<script>
let currentData = [...rawData];
let sortOrders = ["asc", "asc", "asc"];

function dateToNum(str) {
  const m = String(str).match(/(\d+)年(\d+)月(\d+)日/);
  if (!m) return 0;
  return parseInt(m[1]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[3]);
}

function getSortValue(val, colIndex) {
  if (colIndex === 0) return dateToNum(val);
  if (colIndex === 2) {
    if (val === "-" || val === "") return 9999;
    return parseInt(val) || 9999;
  }
  return val;
}

function initCheckboxes() {
  const container = document.getElementById("colChecks");
  columns.forEach((col, i) => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = true;
    cb.dataset.col = i;
    cb.addEventListener("change", renderTable);
    label.appendChild(cb);
    label.appendChild(document.createTextNode(" " + col));
    container.appendChild(label);
  });
}

function getVisibleCols() {
  return Array.from(document.querySelectorAll("#colChecks input:checked"))
    .map(cb => parseInt(cb.dataset.col));
}

function initSortKeys() {
  const container = document.getElementById("sortKeys");
  ["第1キー", "第2キー", "第3キー"].forEach((label, i) => {
    const row = document.createElement("div");
    row.className = "sort-row";

    const lbl = document.createElement("span");
    lbl.textContent = label;

    const sel = document.createElement("select");
    sel.id = "sortKey" + i;
    sel.appendChild(new Option("（なし）", "-1"));
    columns.forEach((col, j) => sel.appendChild(new Option(col, j)));
    if (i === 0) sel.value = "0";

    const btn = document.createElement("button");
    btn.className = "order-btn asc";
    btn.textContent = "昇順 ▲";
    btn.onclick = () => {
      sortOrders[i] = sortOrders[i] === "asc" ? "desc" : "asc";
      btn.className = "order-btn " + sortOrders[i];
      btn.textContent = sortOrders[i] === "asc" ? "昇順 ▲" : "降順 ▼";
    };

    row.append(lbl, sel, btn);
    container.appendChild(row);
  });
}

function applySort() {
  const keys = [0, 1, 2].map(i =>
    parseInt(document.getElementById("sortKey" + i).value)
  );

  currentData = [...rawData].sort((a, b) => {
    for (let i = 0; i < 3; i++) {
      const col = keys[i];
      if (col === -1) continue;
      const aVal = getSortValue(a[col], col);
      const bVal = getSortValue(b[col], col);
      const isNum = typeof aVal === "number" && typeof bVal === "number";
      const result = isNum
        ? aVal - bVal
        : String(aVal).localeCompare(String(bVal), "ja");
      if (result !== 0) return sortOrders[i] === "asc" ? result : -result;
    }
    return 0;
  });

  renderTable();
}

function renderTable() {
  const vis = getVisibleCols();

  const thead = document.getElementById("thead");
  thead.innerHTML = "";
  const hr = document.createElement("tr");
  vis.forEach(i => {
    const th = document.createElement("th");
    th.textContent = columns[i];
    hr.appendChild(th);
  });
  thead.appendChild(hr);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  currentData.forEach(row => {
    const tr = document.createElement("tr");
    vis.forEach(i => {
      const td = document.createElement("td");
      td.textContent = row[i];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

initCheckboxes();
initSortKeys();
renderTable();
</script>
</body>
</html>
